
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05040b">
<title>PHANTOM — Démon Chaxe</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background: radial-gradient(ellipse at center, #21142e, #080611 65%, #020207);
  color: #e9e3ff;
  font-family: Georgia, serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

main {
  width: min(94vw, 650px);
  padding: 20px;
  position: relative;
  z-index: 3;
}

h1 {
  font-family: Arial, sans-serif;
  letter-spacing: 10px;
  font-size: clamp(30px, 8vw, 52px);
  color: #cbb5ff;
  text-shadow: 0 0 25px #986cff;
}

.subtitle {
  color: #9585ae;
  letter-spacing: 5px;
  font: 11px Arial, sans-serif;
}

#status {
  margin: 18px auto;
  color: #a89abb;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
}

#ghost {
  height: 270px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(.3) translateY(100px);
  transition: 1.2s ease;
  pointer-events: none;
}

#ghost.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.ghost-body {
  width: 170px;
  height: 205px;
  position: relative;
  border-radius: 90px 90px 35px 35px;
  background: linear-gradient(145deg, #eee8ff, #9380c6 55%, #322344);
  box-shadow: 0 0 35px #b99aff, 0 0 100px #7650bd;
  animation: float 3s ease-in-out infinite;
}

.ghost-body:after {
  content: "";
  position: absolute;
  bottom: -28px;
  left: 0;
  width: 100%;
  height: 55px;
  background: inherit;
  clip-path: polygon(0 0, 20% 75%, 40% 0, 60% 75%, 80% 0, 100% 75%, 100% 0);
}

.eyes {
  position: absolute;
  top: 78px;
  left: 34px;
  width: 22px;
  height: 35px;
  background: #14091d;
  border-radius: 50%;
  box-shadow: 75px 0 #14091d, 0 0 15px #ff365e, 75px 0 15px #ff365e;
}

.mouth {
  position: absolute;
  top: 133px;
  left: 68px;
  width: 34px;
  height: 24px;
  border-radius: 50%;
  background: #180a20;
}

@keyframes float {
  0%,100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-18px) rotate(2deg); }
}

#wind {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 2;
  background: repeating-linear-gradient(
    170deg,
    transparent 0 35px,
    rgba(195,175,255,.16) 37px,
    transparent 40px 75px
  );
}

#wind.active {
  opacity: 1;
  animation: storm .35s linear infinite;
}

@keyframes storm {
  from { transform: translateX(-80px); }
  to { transform: translateX(80px); }
}

#dialogue {
  min-height: 75px;
  margin: 20px auto;
  color: #e5d8ff;
  font-size: 19px;
  line-height: 1.5;
  text-shadow: 0 0 12px #9b70ff;
}

button {
  border: 1px solid #9f7bda;
  background: #20142e;
  color: #e8dcff;
  padding: 15px 25px;
  border-radius: 30px;
  font-size: 14px;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 0 20px #67439b;
}

button:disabled {
  opacity: .5;
}

#hint {
  margin-top: 24px;
  color: #766987;
  font: 11px Arial, sans-serif;
  line-height: 1.8;
}

</style>
</head>

<body>

<div id="wind"></div>

<main>
  <h1>PHANTOM</h1>
  <div class="subtitle">THE DEMON CHAXE</div>

  <div id="status">EN ATTENTE...</div>

  <div id="ghost">
    <div class="ghost-body">
      <div class="eyes"></div>
      <div class="mouth"></div>
    </div>
  </div>

  <div id="dialogue">
    Quelque chose rôde dans l'obscurité...
  </div>

  <button id="start">ACTIVER L'ÉCOUTE</button>

  <div id="hint">
    Dis : « J'invoque ici le démon Chaxe »<br>
    Pour le renvoyer : « Démon Chaxe, disparais »
  </div>
</main>

<script>
const statusText = document.getElementById("status");
const ghost = document.getElementById("ghost");
const dialogue = document.getElementById("dialogue");
const wind = document.getElementById("wind");
const startButton = document.getElementById("start");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition;
let listening = false;
let summoned = false;
let speaking = false;
let audioContext;
let windSource;
let windGain;
let hauntTimer = null;
let restartTimer = null;

function normalize(text) {
  return text.toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[.,!?;:'"]/g, "")
    .trim();
}

// Sons de vent générés par le navigateur
function startWindSound() {
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    audioContext.resume();

    if (windSource) return;

    const bufferSize = audioContext.sampleRate * 3;
    const buffer = audioContext.createBuffer(
      1, bufferSize, audioContext.sampleRate
    );

    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1);
    }

    windSource = audioContext.createBufferSource();
    windSource.buffer = buffer;
    windSource.loop = true;

    const filter = audioContext.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 350;

    windGain = audioContext.createGain();
    windGain.gain.value = 0.0;

    windSource.connect(filter);
    filter.connect(windGain);
    windGain.connect(audioContext.destination);

    windSource.start();

    windGain.gain.setTargetAtTime(
      0.24, audioContext.currentTime, 1
    );
  } catch (e) {
    console.log("Audio indisponible", e);
  }
}

function stopWindSound() {
  if (windGain && audioContext) {
    windGain.gain.setTargetAtTime(
      0, audioContext.currentTime, 0.5
    );
  }

  setTimeout(() => {
    try {
      if (windSource) windSource.stop();
    } catch (e) {}

    windSource = null;
  }, 1800);
}

// Voix démoniaque synthétique
function speak(text, callback) {
  if (!("speechSynthesis" in window)) {
    dialogue.textContent = text;
    if (callback) callback();
    return;
  }

  speaking = true;
  dialogue.textContent = text;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "fr-FR";
  utterance.rate = 0.82;
  utterance.pitch = 0.48;
  utterance.volume = 1;

  const voices = window.speechSynthesis.getVoices();
  const frenchVoice = voices.find(v => v.lang.startsWith("fr"));

  if (frenchVoice) utterance.voice = frenchVoice;

  utterance.onend = () => {
    speaking = false;
    if (callback) callback();
  };

  utterance.onerror = () => {
    speaking = false;
    if (callback) callback();
  };

  window.speechSynthesis.speak(utterance);
}

// Apparition
function summon() {
  if (summoned) return;

  summoned = true;
  statusText.textContent = "CHAXE EST PARMI NOUS";
  ghost.classList.add("visible");
  wind.classList.add("active");

  startWindSound();

  speak("Je t'écoute... Parle, humain.", () => {
    setTimeout(() => {
      if (summoned) {
        speak("Je veux les bonbons... Les as-tu trouvés ?");
      }
    }, 500);
  });

  startHaunting();
}

// Disparition
function disappear() {
  if (!summoned) return;

  summoned = false;
  clearTimeout(hauntTimer);

  window.speechSynthesis.cancel();
  speaking = false;

  ghost.classList.remove("visible");
  wind.classList.remove("active");

  stopWindSound();

  statusText.textContent = "CHAXE EST RETOURNÉ DANS L'OMBRE";
  dialogue.textContent = "Le silence retombe...";

  setTimeout(() => {
    if (!summoned) {
      statusText.textContent = "EN ATTENTE...";
      dialogue.textContent = "Quelque chose rôde dans l'obscurité...";
    }
  }, 3500);
}

// Rires et sons maléfiques aléatoires
function startHaunting() {
  clearTimeout(hauntTimer);

  function haunt() {
    if (!summoned) return;

    if (!speaking && Math.random() < 0.75) {
      const sounds = [
        "Hé hé hé hé...",
        "Mouahahahaha...",
        "Tu ne peux pas m'échapper...",
        "Hrrrr... Hahahaha...",
        "Je sens ta peur...",
        "Hehehehehe..."
      ];

      speak(sounds[Math.floor(Math.random() * sounds.length)]);
    }

    hauntTimer = setTimeout(haunt, 35000 + Math.random() * 25000);
  }

  hauntTimer = setTimeout(haunt, 30000);
}

// Compréhension des réponses
function respond(text) {
  const t = normalize(text);

  if (
    t.includes("non") &&
    (t.includes("bonbon") || t.includes("trouve") || t.includes("trouver"))
  ) {
    speak("Comment oses-tu revenir les mains vides... ? Je commence à perdre patience...");
    return;
  }

  if (t.includes("oui") && (t.includes("bonbon") || t.includes("trouve"))) {
    speak("Enfin ! Tu as donc trouvé mes précieux bonbons... Apporte-les-moi !");
    return;
  }

  if (t.includes("bonjour") || t.includes("salut")) {
    speak("Tu oses me saluer comme un vieil ami ? Parle, humain !");
    return;
  }

  if (t.includes("qui es tu") || t.includes("qui es-tu")) {
    speak("Je suis Chaxe... Le démon qui hante ces lieux depuis des siècles...");
    return;
  }

  if (t.includes("peur")) {
    speak("Tu as raison d'avoir peur... Mouahahahaha !");
    return;
  }

  if (t.includes("merci")) {
    speak("Ne me remercie pas, humain. Je ne fais jamais rien gratuitement...");
    return;
  }

  if (t.includes("bonbon")) {
    speak("Mes bonbons ! Ne me parle pas d'autre chose. Les as-tu trouvés ?");
    return;
  }

  if (t.includes("chaxe")) {
    speak("Je suis là, humain... Je t'entends...");
    return;
  }

  const replies = [
    "Intéressant... Continue, humain.",
    "Je t'écoute... Mais choisis bien tes mots...",
    "Hmmm... Je n'aime pas beaucoup cela...",
    "Mouahahaha... Tu me fais rire, humain.",
    "Explique-toi davantage...",
    "Prends garde à ce que tu dis...",
    "Je n'oublie jamais ce que tu me racontes..."
  ];

  speak(replies[Math.floor(Math.random() * replies.length)]);
}

// Reconnaissance vocale permanente
function setupRecognition() {
  if (!SpeechRecognition) {
    statusText.textContent = "NAVIGATEUR NON COMPATIBLE";
    dialogue.textContent =
      "Utilise Google Chrome sur Android pour la reconnaissance vocale.";
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "fr-FR";
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    const result = event.results[event.results.length - 1];
    if (!result.isFinal) return;

    const spoken = result[0].transcript;
    const t = normalize(spoken);

    console.log("Reconnu :", spoken);

    // Ordre de priorité : disparition
    if (
      t.includes("demon chaxe disparais") ||
      t.includes("chaxe disparais") ||
      t.includes("demon chaxe disparait") ||
      t.includes("chaxe disparait")
    ) {
      disappear();
      return;
    }

    // Invocation
    if (
      t.includes("j invoque ici le demon chaxe") ||
      (t.includes("invoque") && t.includes("demon") && t.includes("chaxe"))
    ) {
      if (!summoned) summon();
      return;
    }

    // Conversation active
    if (summoned && !speaking) {
      respond(spoken);
    }
  };

  recognition.onerror = (event) => {
    console.log("Reconnaissance vocale :", event.error);

    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      statusText.textContent = "AUTORISATION MICRO REFUSÉE";
      listening = false;
    }
  };

  recognition.onend = () => {
    if (listening) {
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        try {
          recognition.start();
        } catch (e) {}
      }, 700);
    }
  };
}

function activateListening() {
  if (!SpeechRecognition) {
    statusText.textContent = "UTILISE GOOGLE CHROME";
    return;
  }

  if (listening) return;

  listening = true;

  // Déverrouille l'audio du navigateur après le clic
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    audioContext.resume();
  } catch (e) {}

  setupRecognition();

  try {
    recognition.start();
    startButton.disabled = true;
    startButton.textContent = "ÉCOUTE ACTIVE";
    statusText.textContent = "JE T'ÉCOUTE...";
    dialogue.textContent = "Prononce la formule d'invocation...";
  } catch (e) {
    statusText.textContent = "IMPOSSIBLE DE DÉMARRER LE MICRO";
  }
}

startButton.addEventListener("click", activateListening);

</script>
</body>
</html>
